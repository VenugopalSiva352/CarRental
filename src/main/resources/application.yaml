server:
 port: 8080
 servlet:
   context-path: /app
spring:
  application:
    name: CarRental
  datasource:
    url: jdbc:mysql://localhost:3306/CarRental
    username: root
    password: root@root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

springdoc:
  packages-to-scan: com.rental.services.CarRental
  swagger-ui:
    path: /swagger-ui.html
